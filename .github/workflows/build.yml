name: Build Sheng Kernel

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: 'Kernel source branch to build'
        required: true
        default: 'sheng-7.0.11'
        type: string

  repository_dispatch:
    types: [kernel-update]

env:
  KERNEL_REPO: ianchb/sm8550-mainline
  LOCAL_CONFIG: sm8550.config

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    name: Build Kernel

    steps:
      - name: Determine kernel branch
        id: branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH=""
          if [[ -n "${{ github.event.inputs.kernel_branch }}" ]]; then
            BRANCH="${{ github.event.inputs.kernel_branch }}"
          elif [[ -n "${{ github.event.client_payload.ref }}" ]]; then
            BRANCH="${{ github.event.client_payload.ref }}"
          else
            BRANCH=$(gh api "repos/${{ env.KERNEL_REPO }}" --jq '.default_branch')
          fi
          echo "branch=${BRANCH}" >> $GITHUB_OUTPUT
          echo "Building branch: ${BRANCH}"

      - name: Checkout build scripts
        uses: actions/checkout@v4

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNEL_REPO }}
          ref: ${{ steps.branch.outputs.branch }}
          path: kernel-src
          fetch-depth: 0

      - name: Get kernel commit SHA
        id: kernel_sha
        working-directory: kernel-src
        run: |
          SHA=$(git rev-parse --short HEAD)
          echo "sha=${SHA}" >> $GITHUB_OUTPUT
          echo "Kernel commit: ${SHA}"
          git log --oneline -5

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            clang \
            lld \
            llvm \
            ccache \
            dpkg-dev \
            bison \
            flex \
            bc \
            libelf-dev \
            libssl-dev \
            libgmp-dev \
            openssl \
            kmod \
            cpio \
            rsync \
            gcc \
            make
          clang --version
          ccache --version

      - name: Setup ccache
        run: |
          ccache --set-config=max_size=10G
          ccache --set-config=compression=true
          ccache --set-config=compression_level=6
          ccache --zero-stats

      - name: Restore ccache
        uses: actions/cache@v4
        id: ccache-cache
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-${{ hashFiles('kernel-src/Makefile') }}-${{ steps.branch.outputs.branch }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ hashFiles('kernel-src/Makefile') }}-
            ${{ runner.os }}-ccache-

      - name: Setup mkbootimg
        run: |
          chmod +x ./mkbootimg
          echo "Using prebuilt mkbootimg from repository"

      - name: Build kernel
        run: |
          chmod +x ./build.sh
          ./build.sh "${{ env.LOCAL_CONFIG }}" kernel-src

      - name: Upload linux-xiaomi-sheng.deb
        uses: actions/upload-artifact@v4
        with:
          name: linux-xiaomi-sheng-${{ steps.kernel_sha.outputs.sha }}.deb
          path: out/linux-xiaomi-sheng.deb
          retention-days: 30
          compression-level: 0

      - name: Upload boot images
        uses: actions/upload-artifact@v4
        with:
          name: boot-images-${{ steps.kernel_sha.outputs.sha }}
          path: |
            out/boot_sheng_dualboot.img
            out/boot_sheng_singleboot.img
          retention-days: 30
          compression-level: 0

      - name: Build summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| linux-xiaomi-sheng.deb | $(du -h out/linux-xiaomi-sheng.deb 2>/dev/null | cut -f1 || echo 'N/A') |" >> $GITHUB_STEP_SUMMARY
          echo "| boot_sheng_dualboot.img | $(du -h out/boot_sheng_dualboot.img 2>/dev/null | cut -f1 || echo 'N/A') |" >> $GITHUB_STEP_SUMMARY
          echo "| boot_sheng_singleboot.img | $(du -h out/boot_sheng_singleboot.img 2>/dev/null | cut -f1 || echo 'N/A') |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Kernel commit: \`${{ steps.kernel_sha.outputs.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Branch: \`${{ steps.branch.outputs.branch }}\`" >> $GITHUB_STEP_SUMMARY
